<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>snapcount</title>
    <link rel="icon" type="image/x-icon" href="/assets/images/favicon.png" />
    <!--
      Theme, set BEFORE first paint so there is no flash of the wrong one.
      Must agree with src/components/theme-provider.tsx: same storage key
      (main.tsx passes "snapcount-ui-theme"), same rule — a stored
      "light"/"dark" wins, anything else follows prefers-color-scheme.
      The background below is --app-canvas from theme.css's :root.dark,
      repeated here only because this runs before any stylesheet loads.
    -->
    <script>
      (() => {
        var stored = null
        try {
          stored = localStorage.getItem("snapcount-ui-theme")
        } catch (_e) {}
        var dark =
          stored === "dark" ||
          (stored !== "light" &&
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches)
        var root = document.documentElement
        root.classList.add(dark ? "dark" : "light")
        root.style.colorScheme = dark ? "dark" : "light"
      })()
    </script>
    <style>
      html.dark {
        background: oklch(0.185 0.04 258);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
